[pytest]
# Senza questo file l'import dei package dipendeva da PYTHONPATH impostato a
# mano: run.ps1 lo faceva, i test no, e un revisore che eseguisse `pytest` dalla
# radice otteneva ModuleNotFoundError su `backend`.
pythonpath = .

testpaths =
    backend/tests
    backend/research_pipeline/tests
    evaluation/tests

python_files = test_*.py
python_classes = Test* *Test *Tests
python_functions = test_*

# `-q` resta una scelta di chi esegue; qui si fissa solo cio' che rende la suite
# riproducibile allo stesso modo su ogni macchina.
addopts = --strict-markers

filterwarnings =
    # Deprecazione di starlette/httpx nel TestClient: nota, non azionabile qui.
    ignore::DeprecationWarning:starlette.*
