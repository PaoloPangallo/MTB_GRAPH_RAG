name: Portfolio CI — Python syntax

on:
  push:
    branches: [main, portfolio-refresh-2026-10]
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile active backend modules
        run: python -m compileall -q mtb-graphrag/backend/api mtb-graphrag/backend/pipeline
